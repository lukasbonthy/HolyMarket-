name: HolyMarket tests

on:
  push:
    branches: [main, feature/express-session-auth, feature/anti-cheat-polymarket-v9, feature/answer-animations-v10, feature/premium-motion-v11]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: node --check server.mjs && node --check server/app.mjs && if [ -f server/anti-cheat.mjs ]; then node --check server/anti-cheat.mjs; fi && if [ -f src/app-v9.js ]; then node --check src/app-v9.js; else node --check src/app.js; fi
