name: HolyMarket visual smoke

on:
  push:
    branches: [feature/anti-cheat-polymarket-v9, feature/answer-animations-v10, feature/premium-motion-v11, main]

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start HolyMarket
        run: |
          SESSION_SECRET=visual-test-secret ADMIN_KEY=visual-admin-key node server.mjs > /tmp/holymarket.log 2>&1 &
          echo $! > /tmp/holymarket.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/api/status >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/holymarket.log
          exit 1
      - run: node scripts/visual-smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holymarket-v11-visuals
          path: visual-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/holymarket.log || true
